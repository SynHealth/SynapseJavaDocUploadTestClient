# Sample configuration for document upload test client

# Document information
file:
privateKey:

# OAuth2 authentication
clientId:
clientSecret:
scope:
grant_type:
# Optional: override the default Microsoft Entra ID token endpoint
# tokenUrl: https://login.microsoftonline.com/ae3a12b3-a1b6-492d-81fd-be75596c89b9/oauth2/v2.0/token

# API endpoint configuration
