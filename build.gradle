plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.synapsehealth'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Security and JWT dependencies
	implementation 'org.springframework.security:spring-security-oauth2-client'
	implementation 'org.springframework.security:spring-security-oauth2-jose'

	// JSON parsing
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Add Jackson YAML dataformat dependency
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

	// Yaml configuration
	implementation 'org.yaml:snakeyaml'

	// Lombok for reducing boilerplate code
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Command line parsing
	implementation 'info.picocli:picocli:4.7.5'
	annotationProcessor 'info.picocli:picocli-codegen:4.7.5'

	// Logging
	implementation 'org.slf4j:slf4j-api'
	implementation 'ch.qos.logback:logback-classic'

	// Bouncy Castle for additional crypto operations
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Configure the shadow JAR task
shadowJar {
    archiveBaseName = 'doc-uploader-test-client'
    archiveClassifier = ''
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'com.synapsehealth.doc_uploader_test_client.MainRunner'
    }
}
