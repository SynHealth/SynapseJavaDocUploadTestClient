plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.gradleup.shadow' version '9.6.0'
}

group = 'com.synapsehealth'
version = '1.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	// Boot 4.1 manages Jackson 2.x at 2.21.4; 2.21.5 carries the fix for CVE-2026-54515.
	set('jackson-2-bom.version', "2.21.5")
}

dependencies {
	// Core context only. This is a CLI, not a server, so no servlet container:
	// spring-boot-starter-web would drag in Tomcat and spring-webmvc, neither of
	// which is used (see application.yml: web-application-type: none).
	implementation 'org.springframework.boot:spring-boot-starter'

	// RestTemplate + RestTemplateBuilder, without spring-webmvc or Tomcat.
	// Boot 4 defaults to Jackson 3 (tools.jackson) for HTTP message conversion, but this
	// client never lets Spring convert JSON: every call is exchanged as String and parsed
	// by the services' own Jackson 2 ObjectMapper. Excluding the starter keeps a second,
	// unused Jackson stack out of the shaded jar.
	implementation('org.springframework.boot:spring-boot-starter-restclient') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
	}

	// JSON parsing
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Add Jackson YAML dataformat dependency
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

	// Lombok for reducing boilerplate code
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Command line parsing
	implementation 'info.picocli:picocli:4.7.5'
	annotationProcessor 'info.picocli:picocli-codegen:4.7.5'

	// Logging
	implementation 'org.slf4j:slf4j-api'
	implementation 'ch.qos.logback:logback-classic'

	// Bouncy Castle for PEM private key parsing (SignatureService)
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Configure the shadow JAR task
shadowJar {
    archiveBaseName = 'doc-uploader-test-client'
    archiveClassifier = ''
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'com.synapsehealth.doc_uploader_test_client.MainRunner'
    }
}
